<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NMS Stickers — Print to PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 3.5in 3.5in;
      margin: 0;
    }
    @page rect {
      size: 4in 1in;
      margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      -webkit-font-smoothing: antialiased;
      background: #333;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ============================================
       SHARED BASE
       ============================================ */
    .sticker-wrap {
      width: 3.5in;
      height: 3.5in;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      page-break-after: always;
    }

    .sticker {
      width: 3.0in;
      height: 3.0in;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .new-text {
      font-size: 0.9in;
      line-height: 1;
      color: #e8702a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: -0.1in;
    }

    .band-text {
      font-size: 0.25in;
      line-height: 1;
      color: #f0ece4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: 0.08in;
    }

    /* Serape ring — CSS version (screen) */
    .has-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 0.1in;
      background: conic-gradient(
        #c1272d 0deg,   #c1272d 60deg,
        #e8702a 60deg,  #e8702a 120deg,
        #f0c040 120deg, #f0c040 180deg,
        #1a9988 180deg, #1a9988 240deg,
        #d4326d 240deg, #d4326d 300deg,
        #1b4965 300deg, #1b4965 360deg
      );
      -webkit-mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
      mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
    }

    /* Serape ring — SVG version (print fallback) */
    .serape-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ============================================
       INVERTED
       ============================================ */
    .inverted {
      background: #f0ece4;
    }
    .inverted .new-text {
      color: #e8702a;
    }
    .inverted .band-text {
      color: #0a0a0a;
    }
    .sticker-wrap.inverted-wrap {
      background: #f0ece4;
    }

    /* ============================================
       JUST ¡NEW!
       ============================================ */
    .just-new .new-text {
      font-size: 1.1in;
      margin-top: 0;
      color: #f0ece4;
    }
    .sticker .url-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .just-new.has-ring::before {
      background: conic-gradient(
        #c1272d 0deg,   #c1272d 30deg,
        #e8702a 30deg,  #e8702a 60deg,
        #f0c040 60deg,  #f0c040 90deg,
        #1a9988 90deg,  #1a9988 120deg,
        #d4326d 120deg, #d4326d 150deg,
        #1b4965 150deg, #1b4965 180deg,
        #c1272d 180deg, #c1272d 210deg,
        #e8702a 210deg, #e8702a 240deg,
        #f0c040 240deg, #f0c040 270deg,
        #1a9988 270deg, #1a9988 300deg,
        #d4326d 300deg, #d4326d 330deg,
        #1b4965 330deg, #1b4965 360deg
      );
    }

    /* ============================================
       DIE-CUT RECTANGLE
       ============================================ */
    .sticker-wrap.rect-wrap {
      width: 4.0in;
      height: 1.0in;
      background: #0a0a0a;
      page: rect;
    }
    .rect-sticker {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.1in;
      white-space: nowrap;
    }
    .rect-sticker .serape-stripe {
      position: absolute;
      left: 0;
      right: 0;
      height: 0.14in;
      background: linear-gradient(to right,
        #c1272d 0%, #c1272d 14%,
        #e8702a 14%, #e8702a 28%,
        #f0c040 28%, #f0c040 42%,
        #1a9988 42%, #1a9988 57%,
        #d4326d 57%, #d4326d 71%,
        #1b4965 71%, #1b4965 85%,
        #c1272d 85%, #c1272d 100%
      );
      z-index: 2;
    }
    .rect-sticker .serape-top { top: 0; }
    .rect-sticker .serape-bottom { bottom: 0; }
    .rect-sticker .new-text {
      font-size: 0.34in;
      margin-top: 0;
      color: #f0ece4;
    }
    .rect-sticker .band-text {
      font-size: 0.34in;
      margin-top: 0;
      color: #f0ece4;
    }

    /* ============================================
       SCREEN PREVIEW
       ============================================ */
    @media screen {
      .serape-ring { display: none; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px 20px;
      }
      .sticker-wrap {
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      }
      .page-label {
        font-family: 'Courier New', monospace;
        color: #f0ece4;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 24px;
      }
      .page-label:first-child { margin-top: 0; }
    }

    @media print {
      body { background: none; }
      .page-label { display: none; }
      .has-ring::before { display: none; }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- ORIGINAL -->
  <span class="page-label">Original</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(210 150 150)"/></svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
      <svg class="url-svg" viewBox="0 0 300 300">
        <defs>
          <path id="url-arc-orig" d="M 15,150 A 135,135 0 0,0 285,150"/>
        </defs>
        <text font-family="'Bebas Neue', sans-serif" font-size="9" fill="#f0ece4" fill-opacity="0.7" letter-spacing="1.5">
          <textPath href="#url-arc-orig" startOffset="50%" text-anchor="middle">newmexicanstandoff.com</textPath>
        </text>
      </svg>
    </div>
  </div>

  <!-- INVERTED -->
  <span class="page-label">Inverted</span>
  <div class="sticker-wrap inverted-wrap">
    <div class="sticker has-ring inverted">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(210 150 150)"/></svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
      <svg class="url-svg" viewBox="0 0 300 300">
        <defs>
          <path id="url-arc-inv" d="M 15,150 A 135,135 0 0,0 285,150"/>
        </defs>
        <text font-family="'Bebas Neue', sans-serif" font-size="9" fill="#0a0a0a" fill-opacity="0.7" letter-spacing="1.5">
          <textPath href="#url-arc-inv" startOffset="50%" text-anchor="middle">newmexicanstandoff.com</textPath>
        </text>
      </svg>
    </div>
  </div>

  <!-- JUST ¡NEW! -->
  <span class="page-label">Just &iexcl;NEW!</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring just-new">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(-60 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(0 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(60 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(120 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(180 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(210 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="75.92 835.14" transform="rotate(240 150 150)"/></svg>
      <svg class="url-svg" viewBox="0 0 300 300">
        <g fill="#f0ece4">
          <!-- ¡ (dot top, bar bottom) -->
          <path d="M 28,105 L 44,105 L 44,119 L 28,119 Z M 28,131 L 44,131 L 44,195 L 28,195 Z"/>
          <!-- N (asymmetric V-notch top + single notch at bottom-left → becomes W peak at top-right when flipped) -->
          <path d="M 52,105 L 52,195 L 60,195 L 66,183 L 72,195 L 118,195 L 118,105 L 103,105 L 93,155 L 67,105 Z"/>
          <!-- E (three horizontal bars) -->
          <path d="M 126,105 L 174,105 L 174,119 L 126,119 Z M 130,143 L 170,143 L 170,157 L 130,157 Z M 126,181 L 174,181 L 174,195 L 126,195 Z"/>
          <!-- W (N rotated 180°: single notch-peak at top-right + asymmetric V-notch from bottom) -->
          <path d="M 182,105 L 228,105 L 234,117 L 240,105 L 248,105 L 248,195 L 233,195 L 207,145 L 197,195 L 182,195 Z"/>
          <!-- ! (bar top, dot bottom) -->
          <path d="M 256,105 L 272,105 L 272,169 L 256,169 Z M 256,181 L 272,181 L 272,195 L 256,195 Z"/>
        </g>
        <defs>
          <path id="url-arc-amb-b" d="M 15,150 A 135,135 0 0,0 285,150"/>
          <path id="url-arc-amb-t" d="M 285,150 A 135,135 0 0,0 15,150"/>
        </defs>
        <text font-family="'Bebas Neue', sans-serif" font-size="9" fill="#f0ece4" fill-opacity="0.7" letter-spacing="1.5">
          <textPath href="#url-arc-amb-b" startOffset="50%" text-anchor="middle">newmexicanstandoff.com</textPath>
        </text>
        <text font-family="'Bebas Neue', sans-serif" font-size="9" fill="#f0ece4" fill-opacity="0.7" letter-spacing="1.5">
          <textPath href="#url-arc-amb-t" startOffset="50%" text-anchor="middle">newmexicanstandoff.com</textPath>
        </text>
      </svg>
    </div>
  </div>

  <!-- DIE-CUT RECTANGLE -->
  <span class="page-label">Die-Cut Rectangle</span>
  <div class="sticker-wrap rect-wrap">
    <div class="rect-sticker">
      <div class="serape-stripe serape-top"></div>
      <div class="serape-stripe serape-bottom"></div>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

</body>
</html>
