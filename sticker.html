<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NMS Stickers — Print to PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 3.5in 3.5in;
      margin: 0;
    }
    @page rect {
      size: 4in 1in;
      margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      -webkit-font-smoothing: antialiased;
      background: #333;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ============================================
       SHARED BASE
       ============================================ */
    .sticker-wrap {
      width: 3.5in;
      height: 3.5in;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      page-break-after: always;
    }

    .sticker {
      width: 3.0in;
      height: 3.0in;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .new-text {
      font-size: 0.9in;
      line-height: 1;
      color: #e8702a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: -0.1in;
    }

    .band-text {
      font-size: 0.25in;
      line-height: 1;
      color: #f0ece4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: 0.08in;
    }

    /* Serape ring — CSS version (screen) */
    .has-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 0.1in;
      background: conic-gradient(
        #c1272d 0deg,   #c1272d 60deg,
        #e8702a 60deg,  #e8702a 120deg,
        #f0c040 120deg, #f0c040 180deg,
        #1a9988 180deg, #1a9988 240deg,
        #d4326d 240deg, #d4326d 300deg,
        #1b4965 300deg, #1b4965 360deg
      );
      -webkit-mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
      mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
    }

    /* Serape ring — SVG version (print fallback) */
    .serape-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ============================================
       INVERTED
       ============================================ */
    .inverted {
      background: #f0ece4;
    }
    .inverted .new-text {
      color: #e8702a;
    }
    .inverted .band-text {
      color: #0a0a0a;
    }
    .sticker-wrap.inverted-wrap {
      background: #f0ece4;
    }

    /* ============================================
       JUST ¡NEW!
       ============================================ */
    .just-new .new-text {
      font-size: 1.1in;
      margin-top: 0;
      color: #f0ece4;
    }
    .just-new .url-text {
      position: absolute;
      bottom: 0.18in;
      font-size: 0.07in;
      line-height: 1;
      color: #f0ece4;
      letter-spacing: 0.06em;
      text-transform: none;
      z-index: 1;
      opacity: 0.7;
    }

    /* ============================================
       DIE-CUT RECTANGLE
       ============================================ */
    .sticker-wrap.rect-wrap {
      width: 4.0in;
      height: 1.0in;
      background: #0a0a0a;
      page: rect;
    }
    .rect-sticker {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.1in;
      white-space: nowrap;
    }
    .rect-sticker .serape-stripe {
      position: absolute;
      left: 0;
      right: 0;
      height: 0.14in;
      background: linear-gradient(to right,
        #c1272d 0%, #c1272d 14%,
        #e8702a 14%, #e8702a 28%,
        #f0c040 28%, #f0c040 42%,
        #1a9988 42%, #1a9988 57%,
        #d4326d 57%, #d4326d 71%,
        #1b4965 71%, #1b4965 85%,
        #c1272d 85%, #c1272d 100%
      );
      z-index: 2;
    }
    .rect-sticker .serape-top { top: 0; }
    .rect-sticker .serape-bottom { bottom: 0; }
    .rect-sticker .new-text {
      font-size: 0.34in;
      margin-top: 0;
      color: #f0ece4;
    }
    .rect-sticker .band-text {
      font-size: 0.34in;
      margin-top: 0;
      color: #f0ece4;
    }

    /* ============================================
       SCREEN PREVIEW
       ============================================ */
    @media screen {
      .serape-ring { display: none; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px 20px;
      }
      .sticker-wrap {
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      }
      .page-label {
        font-family: 'Courier New', monospace;
        color: #f0ece4;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 24px;
      }
      .page-label:first-child { margin-top: 0; }
    }

    @media print {
      body { background: none; }
      .page-label { display: none; }
      .has-ring::before { display: none; }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- ORIGINAL -->
  <span class="page-label">Original</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(210 150 150)"/></svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

  <!-- INVERTED -->
  <span class="page-label">Inverted</span>
  <div class="sticker-wrap inverted-wrap">
    <div class="sticker has-ring inverted">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(210 150 150)"/></svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

  <!-- JUST ¡NEW! -->
  <span class="page-label">Just &iexcl;NEW!</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring just-new">
      <svg class="serape-ring" viewBox="0 0 300 300"><circle cx="150" cy="150" r="145" fill="none" stroke="#c1272d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#e8702a" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(-30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#f0c040" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(30 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1a9988" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(90 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#d4326d" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(150 150 150)"/><circle cx="150" cy="150" r="145" fill="none" stroke="#1b4965" stroke-width="10" stroke-dasharray="151.84 759.23" transform="rotate(210 150 150)"/></svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="url-text">newmexicanstandoff.com</div>
    </div>
  </div>

  <!-- DIE-CUT RECTANGLE -->
  <span class="page-label">Die-Cut Rectangle</span>
  <div class="sticker-wrap rect-wrap">
    <div class="rect-sticker">
      <div class="serape-stripe serape-top"></div>
      <div class="serape-stripe serape-bottom"></div>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

</body>
</html>
