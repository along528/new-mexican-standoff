<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NMS Stickers — Print to PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 3.5in 3.5in;
      margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      -webkit-font-smoothing: antialiased;
      background: #333;
      font-family: 'Bebas Neue', sans-serif;
    }

    /* ============================================
       SHARED BASE
       ============================================ */
    .sticker-wrap {
      width: 3.5in;
      height: 3.5in;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      page-break-after: always;
    }

    .sticker {
      width: 3.0in;
      height: 3.0in;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .new-text {
      font-size: 0.9in;
      line-height: 1;
      color: #e8702a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: -0.1in;
    }

    .band-text {
      font-size: 0.25in;
      line-height: 1;
      color: #f0ece4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin-top: 0.08in;
    }

    /* Serape ring */
    .has-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 0.1in;
      background: conic-gradient(
        #c1272d 0deg,   #c1272d 60deg,
        #e8702a 60deg,  #e8702a 120deg,
        #f0c040 120deg, #f0c040 180deg,
        #1a9988 180deg, #1a9988 240deg,
        #d4326d 240deg, #d4326d 300deg,
        #1b4965 300deg, #1b4965 360deg
      );
      -webkit-mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
      mask:
        radial-gradient(farthest-side, transparent calc(100% - 0.1in), #000 calc(100% - 0.1in));
    }

    /* ============================================
       ORIGINAL
       ============================================ */
    /* (uses base styles + .has-ring) */

    /* ============================================
       INVERTED
       ============================================ */
    .inverted {
      background: #f0ece4;
    }
    .inverted .new-text {
      color: #e8702a;
    }
    .inverted .band-text {
      color: #0a0a0a;
    }
    .sticker-wrap.inverted-wrap {
      background: #f0ece4;
    }

    /* ============================================
       JUST ¡NEW!
       ============================================ */
    .just-new .new-text {
      font-size: 1.4in;
      margin-top: 0;
    }

    /* ============================================
       DIE-CUT RECTANGLE
       ============================================ */
    .sticker-wrap.rect-wrap {
      width: 3.5in;
      height: 1.8in;
    }
    .rect-sticker {
      width: 3.2in;
      height: 1.4in;
      border-radius: 0.2in;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.15in;
      overflow: hidden;
    }
    .rect-sticker .serape-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0.12in;
      background: linear-gradient(to right,
        #c1272d 0%, #c1272d 14%,
        #e8702a 14%, #e8702a 28%,
        #f0c040 28%, #f0c040 42%,
        #1a9988 42%, #1a9988 57%,
        #d4326d 57%, #d4326d 71%,
        #1b4965 71%, #1b4965 85%,
        #c1272d 85%, #c1272d 100%
      );
    }
    .rect-sticker .new-text {
      font-size: 0.6in;
      margin-top: 0.05in;
    }
    .rect-sticker .band-text {
      font-size: 0.22in;
      margin-top: 0.05in;
    }

    /* ============================================
       RECORD LABEL
       ============================================ */
    .record-label {
      background: #0a0a0a;
    }
    .record-label .center-hole {
      position: absolute;
      width: 0.3in;
      height: 0.3in;
      border-radius: 50%;
      background: #333;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .record-label .groove-ring {
      position: absolute;
      inset: 0.2in;
      border-radius: 50%;
      border: 1px solid rgba(240,236,228,0.06);
      z-index: 0;
    }
    .record-label .groove-ring:nth-child(2) { inset: 0.35in; }
    .record-label .groove-ring:nth-child(3) { inset: 0.5in; }
    .record-label .curved-text {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .record-label .new-text {
      margin-top: -0.25in;
    }
    .record-label .band-text {
      display: none;
    }

    /* ============================================
       SCREEN PREVIEW
       ============================================ */
    @media screen {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px 20px;
      }
      .sticker-wrap {
        border-radius: 4px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      }
      .page-label {
        font-family: 'Courier New', monospace;
        color: #f0ece4;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 24px;
      }
      .page-label:first-child { margin-top: 0; }
    }

    @media print {
      body { background: #0a0a0a; }
      .page-label { display: none; }
    }
  </style>
</head>
<body>

  <!-- ORIGINAL -->
  <span class="page-label">Original</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring">
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

  <!-- INVERTED -->
  <span class="page-label">Inverted</span>
  <div class="sticker-wrap inverted-wrap">
    <div class="sticker has-ring inverted">
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

  <!-- JUST ¡NEW! -->
  <span class="page-label">Just &iexcl;NEW!</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring just-new">
      <div class="new-text">&iexcl;NEW!</div>
    </div>
  </div>

  <!-- DIE-CUT RECTANGLE -->
  <span class="page-label">Die-Cut Rectangle</span>
  <div class="sticker-wrap rect-wrap">
    <div class="rect-sticker">
      <div class="serape-top"></div>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
    </div>
  </div>

  <!-- RECORD LABEL -->
  <span class="page-label">Record Label</span>
  <div class="sticker-wrap">
    <div class="sticker has-ring record-label">
      <div class="groove-ring"></div>
      <div class="groove-ring"></div>
      <div class="groove-ring"></div>
      <svg class="curved-text" viewBox="0 0 300 300">
        <defs>
          <path id="curve-top" d="M 40,150 A 110,110 0 0,1 260,150" fill="none"/>
          <path id="curve-bottom" d="M 40,150 A 110,110 0 0,0 260,150" fill="none"/>
        </defs>
        <text font-family="'Bebas Neue', sans-serif" font-size="22" fill="#f0ece4" letter-spacing="6">
          <textPath href="#curve-top" startOffset="50%" text-anchor="middle">IMPROVISED MUSIC DUO</textPath>
        </text>
        <text font-family="'Bebas Neue', sans-serif" font-size="22" fill="#f0ece4" letter-spacing="4">
          <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">BOSTON, MA</textPath>
        </text>
      </svg>
      <div class="new-text">&iexcl;NEW!</div>
      <div class="band-text">Mexican Standoff</div>
      <div class="center-hole"></div>
    </div>
  </div>

</body>
</html>
